name: ci

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['11', '17']
    steps:
      - uses: actions/checkout@v4
      - name: Select JVM
        run: |
          echo "temurin:${{ matrix.java }}" >> .mill-jvm-version
          echo "/.mill-jvm-version" >> .git/info/exclude
      - name: Run tests
        run: ./mill -i __.publishArtifacts + __.test.run

  check-binary-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select JVM
        run: |
          echo "temurin:11" >> .mill-jvm-version
          echo "/.mill-jvm-version" >> .git/info/exclude
      - name: Check Binary Compatibility
        run: ./mill -i __.mimaReportBinaryIssues

  publish-sonatype:
    if: github.repository == 'com-lihaoyi/sourcecode' && contains(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    env:
      MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      MILL_PGP_SECRET_BASE64: ${{ secrets.SONATYPE_PGP_PRIVATE_KEY }}
      MILL_PGP_PASSPHRASE: ${{ secrets.SONATYPE_PGP_PRIVATE_KEY_PASSWORD }}
      LANG: "en_US.UTF-8"
      LC_MESSAGES: "en_US.UTF-8"
      LC_ALL: "en_US.UTF-8"

    steps:
      - uses: actions/checkout@v3
      - name: Select JVM
        run: |
          echo "temurin:${{ matrix.java }}" >> .mill-jvm-version
          echo "/.mill-jvm-version" >> .git/info/exclude
      - name: Publish to Maven Central
        run: ./mill -i mill.scalalib.SonatypeCentralPublishModule/

      - name: Create GitHub Release
        id: create_gh_release
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }}
          draft: false
